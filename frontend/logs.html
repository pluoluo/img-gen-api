<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日志查看器 - AI 图片生成器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
  background: #0a0a0f;
  color: #e5e5e5;
  min-height: 100vh;
}

.container { max-width: 1100px; margin: 0 auto; padding: 20px; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}

h1 {
  font-size: 1.2rem;
  font-weight: 700;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-links {
  display: flex;
  gap: 12px;
  align-items: center;
}

.header-links a {
  color: #667eea;
  text-decoration: none;
  font-size: 0.85rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.header-links a:hover { text-decoration: underline; }

.toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.filter-group {
  display: flex;
  gap: 4px;
}

.filter-btn {
  padding: 6px 14px;
  border: 1px solid #2a2a35;
  border-radius: 6px;
  background: #141419;
  color: #888;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s;
  font-family: inherit;
}

.filter-btn:hover { border-color: #667eea; color: #ccc; }
.filter-btn.active {
  background: #667eea;
  color: white;
  border-color: #667eea;
}

.btn {
  padding: 6px 14px;
  border: 1px solid #2a2a35;
  border-radius: 6px;
  background: #141419;
  color: #ccc;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s;
  font-family: inherit;
}

.btn:hover { background: #2a2a35; }
.btn.danger { color: #ff6b7a; }
.btn.danger:hover { border-color: #ff4757; background: rgba(255,71,87,0.1); }
.btn.primary { background: #667eea; border-color: #667eea; color: white; }
.btn.primary:hover { opacity: 0.88; }

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: 0.75rem;
  color: #555;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.auto-refresh {
  display: flex;
  align-items: center;
  gap: 6px;
}

.auto-refresh input[type="checkbox"] {
  accent-color: #667eea;
}

.log-container {
  background: #0d0d14;
  border: 1px solid #1a1a25;
  border-radius: 8px;
  overflow: hidden;
}

.log-header {
  display: grid;
  grid-template-columns: 150px 60px 1fr;
  gap: 8px;
  padding: 10px 16px;
  background: #11111a;
  border-bottom: 1px solid #1a1a25;
  font-size: 0.72rem;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.log-entries {
  max-height: 80vh;
  overflow-y: auto;
  font-size: 0.78rem;
  line-height: 1.5;
}

.log-entry {
  display: grid;
  grid-template-columns: 150px 60px 1fr;
  gap: 8px;
  padding: 6px 16px;
  border-bottom: 1px solid #0d0d18;
  transition: background 0.15s;
}

.log-entry:hover { background: #14141f; }
.log-entry:last-child { border-bottom: none; }

.log-ts {
  color: #555;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.log-level {
  font-weight: 600;
  font-size: 0.7rem;
  padding: 1px 6px;
  border-radius: 3px;
  text-align: center;
  align-self: center;
  width: fit-content;
}

.log-level.INFO {
  color: #22c55e;
  background: rgba(34, 197, 94, 0.08);
}
.log-level.WARN {
  color: #f59e0b;
  background: rgba(245, 158, 11, 0.08);
}
.log-level.ERROR {
  color: #ef4444;
  background: rgba(239, 68, 68, 0.08);
}
.log-level.RAW { display: none; }

.log-msg {
  color: #bbb;
  word-break: break-all;
  white-space: pre-wrap;
}

.log-msg .ctx-toggle {
  color: #667eea;
  cursor: pointer;
  font-size: 0.7rem;
  margin-left: 6px;
}

.log-msg .ctx-detail {
  display: none;
  margin-top: 4px;
  padding: 6px 8px;
  background: #11111a;
  border: 1px solid #1a1a25;
  border-radius: 4px;
  font-size: 0.72rem;
  color: #777;
  white-space: pre-wrap;
}

.log-msg .ctx-detail.show { display: block; }

.empty-msg {
  padding: 40px;
  text-align: center;
  color: #444;
  font-size: 0.9rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.loading-msg {
  padding: 40px;
  text-align: center;
  color: #555;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #1a1a25;
  border: 1px solid #2a2a35;
  border-radius: 8px;
  padding: 10px 20px;
  color: #ccc;
  font-size: 0.8rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 100;
}
.toast.show { opacity: 1; }

/* Scrollbar */
.log-entries::-webkit-scrollbar { width: 6px; }
.log-entries::-webkit-scrollbar-track { background: #0d0d14; }
.log-entries::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 3px; }
.log-entries::-webkit-scrollbar-thumb:hover { background: #3a3a45; }

@media (max-width: 640px) {
  .log-entry, .log-header {
    grid-template-columns: 100px 50px 1fr;
    font-size: 0.7rem;
  }
  .log-ts { font-size: 0.68rem; }
  .header-links a { font-size: 0.75rem; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📋 日志查看器</h1>
    <div class="header-links">
      <a href="/">← 返回生成页</a>
      <a href="/gallery">🖼️ 图库</a>
    </div>
  </header>

  <div class="toolbar">
    <div class="filter-group" id="filterGroup">
      <button class="filter-btn active" data-level="">全部</button>
      <button class="filter-btn" data-level="INFO">INFO</button>
      <button class="filter-btn" data-level="WARN">WARN</button>
      <button class="filter-btn" data-level="ERROR">ERROR</button>
    </div>
    <button class="btn" id="refreshBtn">🔄 刷新</button>
    <button class="btn primary" id="copyBtn">📋 复制</button>
    <button class="btn danger" id="clearBtn">🗑️ 清空</button>
  </div>

  <div class="auto-refresh">
    <input type="checkbox" id="autoRefresh" checked>
    <label for="autoRefresh">自动刷新 (3s)</label>
  </div>

  <div class="status-bar">
    <span id="entryCount">加载中...</span>
    <span id="lastUpdate"></span>
  </div>

  <div class="log-container">
    <div class="log-header">
      <span>时间</span>
      <span>级别</span>
      <span>消息</span>
    </div>
    <div class="log-entries" id="logEntries">
      <div class="loading-msg">正在加载日志...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── State ──────────────────────────────────────────────────────────

let currentLevel = '';
let pollTimer = null;
const POLL_INTERVAL = 3000;

// ─── DOM ────────────────────────────────────────────────────────────

const logEntries = document.getElementById('logEntries');
const entryCount = document.getElementById('entryCount');
const lastUpdate = document.getElementById('lastUpdate');
const autoRefreshCb = document.getElementById('autoRefresh');
const toast = document.getElementById('toast');

// ─── Toast ─────────────────────────────────────────────────────────

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._hide);
  toast._hide = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ─── Format ────────────────────────────────────────────────────────

function formatTs(ts) {
  if (!ts) return '--';
  return ts;
}

function levelClass(lv) {
  if (lv === 'INFO') return 'INFO';
  if (lv === 'WARN') return 'WARN';
  if (lv === 'ERROR') return 'ERROR';
  return 'RAW';
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatMsg(entry) {
  let html = escapeHtml(entry.msg || '');

  if (entry.ctx && Object.keys(entry.ctx).length > 0) {
    const ctxJson = JSON.stringify(entry.ctx, null, 2);
    const key = 'ctx_' + Math.random().toString(36).slice(2, 8);
    html += ` <span class="ctx-toggle" onclick="toggleCtx('${key}')">[详情]</span>`;
    html += `<div class="ctx-detail" id="${key}">${escapeHtml(ctxJson)}</div>`;
  }

  return html;
}

function toggleCtx(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('show');
}

// ─── Fetch Logs ────────────────────────────────────────────────────

async function fetchLogs() {
  const params = new URLSearchParams({ limit: '500' });
  if (currentLevel) params.set('level', currentLevel);

  try {
    const resp = await fetch(`/api/v1/logs?${params}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    renderLogs(data.entries);
    return true;
  } catch (err) {
    logEntries.innerHTML = `<div class="empty-msg">❌ 加载失败：${escapeHtml(err.message)}</div>`;
    return false;
  }
}

function renderLogs(entries) {
  if (!entries || entries.length === 0) {
    logEntries.innerHTML = '<div class="empty-msg">暂无日志。生成一次图片就会有记录。</div>';
    entryCount.textContent = '0 条';
    return;
  }

  let html = '';
  for (const entry of entries) {
    const ts = formatTs(entry.ts);
    const lv = levelClass(entry.level);
    const msg = formatMsg(entry);
    html += `<div class="log-entry">
      <span class="log-ts">${escapeHtml(ts)}</span>
      <span class="log-level ${lv}">${lv}</span>
      <span class="log-msg">${msg}</span>
    </div>`;
  }

  logEntries.innerHTML = html;
  entryCount.textContent = `${entries.length} 条`;

  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', { hour12: false });
  lastUpdate.textContent = `更新于 ${timeStr}`;

  // Scroll to bottom (newest first, so bottom = top actually)
  // But newer entries are shown first, so scroll to top
  logEntries.scrollTop = 0;
}

// ─── Actions ───────────────────────────────────────────────────────

async function refresh() {
  await fetchLogs();
}

async function copyLogs() {
  try {
    const entries = logEntries.querySelectorAll('.log-entry');
    const lines = [];
    for (const e of entries) {
      const ts = e.querySelector('.log-ts')?.textContent || '';
      const lv = e.querySelector('.log-level')?.textContent || '';
      const msg = e.querySelector('.log-msg')?.textContent || '';
      lines.push(`${ts} [${lv}] ${msg}`);
    }
    await navigator.clipboard.writeText(lines.join('\n'));
    showToast('✅ 已复制到剪贴板');
  } catch (err) {
    showToast('❌ 复制失败');
  }
}

async function clearLogs() {
  if (!confirm('确定清空所有日志？')) return;
  try {
    const resp = await fetch('/api/v1/logs/clear', { method: 'POST' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    showToast('✅ 日志已清空');
    await refresh();
  } catch (err) {
    showToast('❌ 清空失败');
  }
}

// ─── Polling ───────────────────────────────────────────────────────

function startPoll() {
  stopPoll();
  pollTimer = setInterval(refresh, POLL_INTERVAL);
}

function stopPoll() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

autoRefreshCb.addEventListener('change', () => {
  if (autoRefreshCb.checked) startPoll();
  else stopPoll();
});

// ─── Filter ────────────────────────────────────────────────────────

document.getElementById('filterGroup').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;

  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentLevel = btn.dataset.level;
  refresh();
});

// ─── Button Events ─────────────────────────────────────────────────

document.getElementById('refreshBtn').addEventListener('click', refresh);
document.getElementById('copyBtn').addEventListener('click', copyLogs);
document.getElementById('clearBtn').addEventListener('click', clearLogs);

// ─── Init ──────────────────────────────────────────────────────────

refresh();
if (autoRefreshCb.checked) startPoll();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>图片库</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0a0f;
  color: #e5e5e5;
  min-height: 100vh;
}
.container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid #2a2a35;
}
h1 {
  font-size: 1.4rem;
  font-weight: 700;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-actions { display: flex; gap: 10px; align-items: center; }
.back-btn, .select-btn, .cancel-btn {
  background: #1a1a22;
  border: 1px solid #2a2a35;
  color: #ccc;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
  text-decoration: none;
}
.back-btn:hover, .select-btn:hover, .cancel-btn:hover { background: #2a2a35; }
.select-btn.active { background: #667eea; border-color: #667eea; color: #fff; }

/* Batch toolbar */
.batch-toolbar {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: #1a1a22;
  border: 1px solid #2a2a35;
  border-radius: 10px;
  margin-bottom: 16px;
}
.batch-toolbar.show { display: flex; }
.batch-toolbar .count { color: #aaa; font-size: 0.85rem; flex: 1; }
.batch-del-btn {
  background: #5a1a1a;
  border: 1px solid #7a2a2a;
  color: #e57373;
  padding: 7px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
}
.batch-del-btn:hover { background: #7a2020; border-color: #9a3a3a; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}
.card {
  background: #141419;
  border: 2px solid #2a2a35;
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.2s;
  position: relative;
}
.card:hover { border-color: #667eea; }
.card.selected { border-color: #667eea; background: #1a1a2a; }

/* Checkbox overlay */
.card .cb-wrap {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 5;
  display: none;
}
.card .cb-wrap.show { display: block; }
.card input[type="checkbox"] {
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: #667eea;
}

.card img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  cursor: pointer;
}
.card img.thumb-loaded { cursor: pointer; }

.card .info { padding: 12px; }
.card .prompt {
  font-size: 0.8rem;
  color: #aaa;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 8px;
}
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  background: #1a1a22;
  border: 1px solid #2a2a35;
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 0.7rem;
  color: #888;
}

.empty {
  text-align: center;
  padding: 80px 0;
  color: #555;
  font-size: 1rem;
}

/* Modal */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  z-index: 100;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal.show { display: flex; }

.modal-body {
  display: flex;
  gap: 24px;
  width: 100%;
  max-height: 90vh;
  background: #141419;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid #2a2a35;
  position: relative;
}

.modal-img-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0d0d12;
  overflow: hidden;
  position: relative;
}
.modal-img-wrap img {
  max-width: 100%;
  max-height: 85vh;
  object-fit: contain;
}

/* Prev/Next buttons */
.nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(20,20,25,0.85);
  border: 1px solid #2a2a35;
  color: #ccc;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.2rem;
  line-height: 44px;
  text-align: center;
  z-index: 10;
  transition: background 0.2s;
}
.nav-btn:hover { background: #2a2a35; }
.nav-btn.prev { left: 12px; }
.nav-btn.next { right: 12px; }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.modal-info {
  width: 320px;
  flex-shrink: 0;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
  max-height: 85vh;
}
.modal-info h3 {
  font-size: 0.85rem;
  color: #aaa;
  word-break: break-word;
  line-height: 1.5;
}

.prompt-block {
  background: #1a1a22;
  border: 1px solid #2a2a35;
  border-radius: 8px;
  padding: 12px;
  position: relative;
}
.prompt-block .prompt-text {
  font-size: 0.82rem;
  color: #ccc;
  line-height: 1.5;
  word-break: break-word;
  max-height: 200px;
  overflow-y: auto;
}
.copy-btn {
  margin-top: 8px;
  background: #667eea;
  border: none;
  color: #fff;
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.75rem;
  width: 100%;
}
.copy-btn:hover { background: #5a6fd6; }
.copy-btn.copied { background: #4caf50; }

.reference-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.reference-strip a { color: inherit; font-size: 0.75rem; text-align: center; }
.reference-strip img { display: block; width: 84px; height: 84px; object-fit: contain; border: 1px solid currentColor; border-radius: 6px; margin-bottom: 4px; }
.modal-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.modal-date { font-size: 0.75rem; color: #555; }
.modal-counter {
  font-size: 0.75rem;
  color: #555;
  text-align: center;
  margin-top: -4px;
}
.modal-actions { margin-top: auto; display: flex; gap: 8px; }
.download-btn {
  flex: 1;
  display: inline-block;
  background: #667eea;
  border: none;
  color: #fff;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.8rem;
  text-align: center;
  text-decoration: none;
}
.download-btn:hover { background: #5a6fd6; }
.delete-btn {
  flex: 1;
  background: #2a1a1a;
  border: 1px solid #5a2a2a;
  color: #e57373;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.8rem;
}
.delete-btn:hover { background: #3a2020; border-color: #7a3a3a; }

.close-btn {
  position: absolute;
  top: 16px;
  right: 16px;
  background: rgba(20,20,25,0.9);
  border: 1px solid #2a2a35;
  color: #ccc;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.1rem;
  line-height: 36px;
  text-align: center;
  z-index: 10;
}
.close-btn:hover { background: #2a2a35; }

.load-more {
  text-align: center;
  padding: 24px;
}
.load-more button {
  background: #1a1a22;
  border: 1px solid #2a2a35;
  color: #ccc;
  padding: 10px 24px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
}
.load-more button:hover { background: #2a2a35; }
.load-more button:disabled { opacity: 0.4; cursor: not-allowed; }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #1a1a22;
  border: 1px solid #667eea;
  color: #ccc;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 0.85rem;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* Mobile */
@media (max-width: 700px) {
  .modal-body { flex-direction: column; max-height: 95vh; }
  .modal-info { width: 100%; max-height: none; }
  .modal-img-wrap { max-height: 50vh; }
  .modal-img-wrap img { max-height: 50vh; }
  .nav-btn { width: 36px; height: 36px; line-height: 36px; font-size: 1rem; }
}
header, .header-actions { flex-wrap: wrap; gap: 12px; }
.cleanup-dialog { margin: auto; width: min(520px, calc(100% - 32px)); max-height: 85dvh; overflow: auto; padding: 24px; border: 1px solid #353543; border-radius: 12px; background: #141419; color: #e5e5e5; }
.cleanup-dialog::backdrop { background: #000a; }
.cleanup-dialog h2 { font-size: 1.25rem; margin-bottom: 16px; }
.cleanup-dialog p { line-height: 1.7; margin-bottom: 16px; color: #bbb; }
.cleanup-dialog label { display: block; margin: 16px 0 8px; }
.cleanup-dialog select, .cleanup-dialog input { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 6px; color-scheme: dark; background: #202028; color: #eee; font: inherit; }
.cleanup-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.cleanup-dialog button:disabled { opacity: .45; cursor: default; }
.cleanup-dialog :focus-visible { outline: 2px solid #99aaff; outline-offset: 3px; }
#cleanupDelete { color: #ffb0b0; }
#cleanupStatus { margin-top: 16px; white-space: pre-line; }
.time-filter { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; margin-bottom: 16px; }
.time-filter label { display: grid; gap: 6px; font-size: .85rem; color: #ccc; }
.time-filter input { min-width: 0; padding: 8px 10px; border: 1px solid #444; border-radius: 6px; background: #202028; color: #eee; color-scheme: dark; font: inherit; }
.filter-summary { color: #bbb; font-size: .9rem; line-height: 1.7; margin-bottom: 16px; }
.time-filter :focus-visible { outline: 2px solid #99aaff; outline-offset: 3px; }
.card .created-date { color: #aaa; font-size: .75rem; margin-top: 8px; }
.modal-actions { flex-wrap: wrap; }
.modal-actions > * { white-space: nowrap; }
.asset-btn { background: #202028; color: #eee; border: 1px solid #444; border-radius: 8px; padding: 10px 16px; font: inherit; font-size: .85rem; cursor: pointer; }
.asset-btn:hover { background: #30303a; }
.asset-btn:disabled { opacity: .6; cursor: default; }
.asset-btn:focus-visible { outline: 2px solid #99aaff; outline-offset: 3px; }
.asset-status { color: #bbb; font-size: .85rem; line-height: 1.6; margin: 12px 0; }
.asset-status a { color: #c4ccff; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🖼️ 图片库</h1>
    <div class="header-actions">
      <a href="/logs" style="background:#1a1a22;border:1px solid #2a2a35;color:#ccc;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:0.85rem;text-decoration:none;">📋 日志</a>
      <button class="select-btn" id="cleanupOpen">按时间清理</button>
      <button class="select-btn" id="selectBtn">☑️ 选择</button>
      <button class="cancel-btn" id="cancelSelectBtn" style="display:none">取消选择</button>
      <a href="/" class="back-btn">← 返回画布</a>
    </div>
  </header>

  <form class="time-filter" id="timeFilter">
    <label for="filterStart">开始日期<input id="filterStart" type="date"></label>
    <label for="filterEnd">结束日期<input id="filterEnd" type="date"></label>
    <button class="select-btn" type="submit">筛选作品</button>
    <button class="cancel-btn" type="button" id="filterClear">显示全部</button>
  </form>
  <p class="filter-summary" id="filterSummary" role="status" aria-live="polite">按生成时间筛选，开始和结束日期均包含当天；留空表示不限，按服务器本地时间计算。</p>

  <!-- Batch delete toolbar -->
  <div class="batch-toolbar" id="batchToolbar">
    <span class="count" id="batchCount">已选择 0 张</span>
    <button class="batch-del-btn" id="batchDelBtn">🗑 批量删除</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">暂无图片，生成一些吧～</div>
  <div class="load-more"><button id="loadMoreBtn" style="display:none">加载更多</button></div>
</div>

<dialog class="cleanup-dialog" id="cleanupDialog" aria-labelledby="cleanupTitle">
  <h2 id="cleanupTitle">按时间清理旧作品</h2>
  <p>范围为整个旧图库，不受页面筛选或勾选影响。需保留部分作品时，请先查看，再仅勾选不需要的作品进行批量删除。删除后无法恢复，原图、缩略图和图库记录会一并移除。仍引用原图链接的内容可能无法显示；已导入“我的资产”的独立副本会保留。</p>
  <label for="cleanupPeriod">删除哪个时间之前的作品</label>
  <select id="cleanupPeriod"><option value="1">一个月前</option><option value="3" selected>三个月前</option><option value="6">半年前</option><option value="custom">指定日期</option></select>
  <div id="cleanupDateField" hidden><label for="cleanupDate">截止日期（不含当天）</label><input id="cleanupDate" type="date"></div>
  <p id="cleanupStatus" role="status" aria-live="polite">先预览待删除数量，再确认删除。</p>
  <div class="cleanup-actions">
    <button class="cancel-btn" id="cleanupClose">取消</button>
    <button class="select-btn" id="cleanupPreview">预览数量</button>
    <button class="select-btn" id="cleanupView" disabled>查看这些作品</button>
    <button class="batch-del-btn" id="cleanupDelete" disabled>确认删除</button>
  </div>
</dialog>

<!-- Image detail modal -->
<div class="modal" id="modal">
  <button class="close-btn" id="closeModal">×</button>
  <button class="nav-btn prev" id="prevBtn">‹</button>
  <button class="nav-btn next" id="nextBtn">›</button>
  <div class="modal-body">
    <div class="modal-img-wrap">
      <img id="modalImg" src="" alt="">
    </div>
    <div class="modal-info">
      <h3>提示词</h3>
      <div class="prompt-block">
        <div class="prompt-text" id="modalPrompt"></div>
        <button class="copy-btn" id="copyBtn">📋 复制提示词</button>
      </div>
      <div class="modal-meta" id="modalMeta"></div>
      <div id="modalReferences" aria-label="生成参考图"></div>
      <p class="modal-date" id="modalDate"></p>
      <p class="modal-counter" id="modalCounter"></p>
      <p class="asset-status" id="assetStatus" role="status" aria-live="polite"></p>
      <div class="modal-actions">
        <button id="addAssetBtn" class="asset-btn">加入资产</button>
        <a id="downloadBtn" class="download-btn" href="#" download>⬇ 下载原图</a>
        <button class="delete-btn" id="deleteBtn">🗑 删除</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const loadMoreBtn = document.getElementById('loadMoreBtn');
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
const modalPrompt = document.getElementById('modalPrompt');
const modalMeta = document.getElementById('modalMeta');
const modalDate = document.getElementById('modalDate');
const modalCounter = document.getElementById('modalCounter');
const toast = document.getElementById('toast');
const selectBtn = document.getElementById('selectBtn');
const cancelSelectBtn = document.getElementById('cancelSelectBtn');
const batchToolbar = document.getElementById('batchToolbar');
const batchCount = document.getElementById('batchCount');
const batchDelBtn = document.getElementById('batchDelBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let offset = 0;
let loading = false;
let galleryReloadPending = false;
let galleryFilter = { start: '', end: '' };
let galleryFilterRevision = 0;
const filterSummary = document.getElementById('filterSummary');
function applyGalleryFilter(start, end) {
  galleryFilter = { start, end };
  galleryFilterRevision++;
  document.getElementById('filterStart').value = start;
  document.getElementById('filterEnd').value = end;
  exitSelectMode();
  modal.classList.remove('show');
  void loadGallery(true);
}
document.getElementById('timeFilter').addEventListener('submit', event => {
  event.preventDefault();
  const start = document.getElementById('filterStart').value;
  const end = document.getElementById('filterEnd').value;
  if (start && end && start > end) { filterSummary.textContent = '开始日期不能晚于结束日期，当前列表未改变。'; return; }
  applyGalleryFilter(start, end);
});
document.getElementById('filterClear').addEventListener('click', () => applyGalleryFilter('', ''));
const limit = 24;
let currentItems = [];       // all loaded items for modal nav
let currentIndex = -1;       // modal's current position in currentItems
let currentItem = null;      // alias for currentItems[currentIndex]
let selectMode = false;
let selectedIds = new Set();

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function buildTag(text) {
  const s = document.createElement('span');
  s.className = 'tag';
  s.textContent = text;
  return s;
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit' });
}

function truncatePrompt(p, len=60) {
  return p.length > len ? p.slice(0, len) + '…' : p;
}

async function renderCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = item.id;

  // Checkbox (only visible in select mode)
  const cbWrap = document.createElement('div');
  cbWrap.className = 'cb-wrap' + (selectMode ? ' show' : '');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = selectedIds.has(item.id);
  cb.addEventListener('change', () => {
    if (cb.checked) selectedIds.add(item.id);
    else selectedIds.delete(item.id);
    updateBatchToolbar();
  });
  cbWrap.appendChild(cb);
  card.appendChild(cbWrap);

  const img = document.createElement('img');
  img.alt = truncatePrompt(item.prompt);
  img.loading = 'lazy';

  const localSrc = `/gallery/${item.filename}`;
  const thumbSrc = item.thumb_filename ? `/gallery/thumb/${item.thumb_filename}` : localSrc;
  const fallbackSrc = item.image_url || '';

  img.addEventListener('click', () => {
    if (selectMode) {
      cb.checked = !cb.checked;
      if (cb.checked) selectedIds.add(item.id);
      else selectedIds.delete(item.id);
      updateBatchToolbar();
    } else {
      openModal(item);
    }
  });

  img.src = thumbSrc;
  img.onerror = () => {
    if (fallbackSrc) img.src = fallbackSrc;
    else img.src = localSrc;
  };

  const info = document.createElement('div');
  info.className = 'info';
  info.innerHTML = `<div class="prompt">${truncatePrompt(item.prompt)}</div>`;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.appendChild(buildTag(item.sub_model));
  if (item.size) meta.appendChild(buildTag(item.size));
  if (item.quality) meta.appendChild(buildTag(item.quality));
  info.appendChild(meta);
  const date = document.createElement('p');
  date.className = 'created-date';
  date.textContent = formatDate(item.created_at);
  info.appendChild(date);
  card.appendChild(img);
  card.appendChild(info);
  grid.appendChild(card);
}

function updateBatchToolbar() {
  const n = selectedIds.size;
  batchCount.textContent = `已选择 ${n} 张`;
  batchToolbar.classList.toggle('show', n > 0);
  // Update card selected states
  document.querySelectorAll('.card').forEach(c => {
    c.classList.toggle('selected', selectedIds.has(c.dataset.id));
    const cb = c.querySelector('input[type="checkbox"]');
    if (cb) cb.checked = selectedIds.has(c.dataset.id);
  });
}

function enterSelectMode() {
  selectMode = true;
  selectBtn.style.display = 'none';
  cancelSelectBtn.style.display = 'inline-block';
  document.querySelectorAll('.cb-wrap').forEach(el => el.classList.add('show'));
}

function exitSelectMode() {
  selectMode = false;
  selectBtn.style.display = 'inline-block';
  cancelSelectBtn.style.display = 'none';
  selectedIds.clear();
  document.querySelectorAll('.cb-wrap').forEach(el => el.classList.remove('show'));
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  batchToolbar.classList.remove('show');
}

selectBtn.addEventListener('click', enterSelectMode);
cancelSelectBtn.addEventListener('click', exitSelectMode);

batchDelBtn.addEventListener('click', async () => {
  if (selectedIds.size === 0) return;
  if (!confirm(`确定删除选中的 ${selectedIds.size} 张图片？`)) return;
  try {
    const resp = await fetch('/api/v1/gallery/batch-delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: [...selectedIds] }),
    });
    if (!resp.ok) throw new Error();
    showToast(`已删除 ${selectedIds.size} 张图片`);
    exitSelectMode();
    offset = 0;
    grid.innerHTML = '';
    currentItems = [];
    loadGallery(true);
  } catch(e) {
    showToast('批量删除失败');
  }
});

// ─── Modal ────────────────────────────────────────────────────────────────────

function openModal(item) {
  currentItem = item;
  currentIndex = currentItems.findIndex(i => i.id === item.id);

  _renderModal();
  modal.classList.add('show');
}

let addingAssetId = null;
const addedAssetIds = new Set();
const assetMessages = new Map();
const addAssetBtn = document.getElementById('addAssetBtn');
const assetStatus = document.getElementById('assetStatus');
function renderAssetAction() {
  const item = currentItems[currentIndex];
  if (!item) return;
  const added = addedAssetIds.has(item.id);
  addAssetBtn.textContent = addingAssetId === item.id ? '正在加入…' : added ? '已加入资产' : '加入资产';
  addAssetBtn.disabled = Boolean(addingAssetId) || added;
  assetStatus.replaceChildren();
  assetStatus.textContent = assetMessages.get(item.id) || '保存原图副本到当前浏览器的“我的资产”，清理旧图库后仍可使用。';
  if (added) {
    const link = document.createElement('a');
    link.href = '/infinite/assets';
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = ' 查看资产';
    assetStatus.appendChild(link);
  }
}
addAssetBtn.addEventListener('click', async () => {
  const item = currentItems[currentIndex];
  if (!item || addingAssetId || addedAssetIds.has(item.id)) return;
  addingAssetId = item.id;
  assetMessages.set(item.id, '正在保存原图，请稍候…');
  renderAssetAction();
  try {
    const { addGalleryAsset } = await import('/infinite/legacy-gallery-assets.js');
    await addGalleryAsset(item);
    addedAssetIds.add(item.id);
    assetMessages.set(item.id, '已保存到当前浏览器的“我的资产”。');
  } catch (error) {
    assetMessages.set(item.id, `加入失败：${error.message || '请检查图片是否可用后重试'}`);
  } finally {
    addingAssetId = null;
    renderAssetAction();
  }
});

function _renderModal() {
  const item = currentItems[currentIndex];
  if (!item) return;

  renderAssetAction();
  modalPrompt.textContent = item.prompt;
  modalDate.textContent = formatDate(item.created_at);
  modalMeta.innerHTML = '';
  modalMeta.appendChild(buildTag(item.sub_model));
  if (item.size) modalMeta.appendChild(buildTag(item.size));
  if (item.quality) modalMeta.appendChild(buildTag(item.quality));
  modalMeta.appendChild(buildTag(`×${item.n}`));

  const references = document.getElementById('modalReferences');
  references.replaceChildren();
  const label = document.createElement('p');
  label.className = 'modal-date';
  label.textContent = item.inputs ? (item.inputs.references.length ? `参考图 ${item.inputs.references.length} 张（按提交顺序）` : '文生图 · 无参考图') : '旧记录未保存参考图';
  references.appendChild(label);
  const strip = document.createElement('div');
  strip.className = 'reference-strip';
  const inputs = (item.inputs?.references || []).map((reference, index) => ({ reference, title: `参考图 ${index + 1}` }));
  if (item.inputs?.mask) inputs.push({ reference: item.inputs.mask, title: '局部编辑蒙版' });
  for (const { reference, title } of inputs) {
    const link = document.createElement('a');
    link.href = reference.url;
    link.download = reference.filename;
    link.title = `下载${title}原图`;
    const image = document.createElement('img');
    image.src = reference.url;
    image.alt = title;
    link.append(image, document.createTextNode(title));
    strip.appendChild(link);
  }
  references.appendChild(strip);

  const localSrc = `/gallery/${item.filename}`;
  const fallbackSrc = item.image_url || '';
  const imgSrc = localSrc || fallbackSrc;
  modalImg.src = imgSrc;
  modalImg.onerror = () => { if (fallbackSrc) modalImg.src = fallbackSrc; };

  const downloadBtn = document.getElementById('downloadBtn');
  downloadBtn.href = imgSrc;
  downloadBtn.download = item.filename || 'image.png';

  const copyBtn = document.getElementById('copyBtn');
  copyBtn.textContent = '📋 复制提示词';
  copyBtn.classList.remove('copied');

  // Counter
  modalCounter.textContent = `${currentIndex + 1} / ${currentItems.length}`;

  // Nav buttons
  prevBtn.disabled = currentIndex <= 0;
  nextBtn.disabled = currentIndex >= currentItems.length - 1;
}

prevBtn.addEventListener('click', () => {
  if (currentIndex > 0) {
    currentIndex--;
    _renderModal();
  }
});

nextBtn.addEventListener('click', () => {
  if (currentIndex < currentItems.length - 1) {
    currentIndex++;
    _renderModal();
  }
});

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (!modal.classList.contains('show')) return;
  if (e.key === 'ArrowLeft') { if (currentIndex > 0) { currentIndex--; _renderModal(); } }
  if (e.key === 'ArrowRight') { if (currentIndex < currentItems.length - 1) { currentIndex++; _renderModal(); } }
  if (e.key === 'Escape') modal.classList.remove('show');
});

// Copy prompt
document.getElementById('copyBtn').addEventListener('click', () => {
  if (!currentItem) return;
  try {
    const ta = document.createElement('textarea');
    ta.value = currentItems[currentIndex]?.prompt || '';
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ 已复制';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 复制提示词';
      btn.classList.remove('copied');
    }, 1500);
  } catch(e) {
    showToast('复制失败');
  }
});

// Delete single
document.getElementById('deleteBtn').addEventListener('click', async () => {
  const item = currentItems[currentIndex];
  if (!item || !confirm('确定删除这张图片？')) return;
  try {
    const resp = await fetch(`/api/v1/gallery/${item.id}`, { method: 'DELETE' });
    if (!resp.ok) throw new Error();
    showToast('已删除');
    modal.classList.remove('show');
    // Remove from currentItems and re-render
    currentItems.splice(currentIndex, 1);
    if (currentIndex >= currentItems.length) currentIndex = currentItems.length - 1;
    offset = 0;
    grid.innerHTML = '';
    loadGallery(true);
  } catch(e) {
    showToast('删除失败');
  }
});

document.getElementById('closeModal').addEventListener('click', () => modal.classList.remove('show'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });

// ─── Gallery loading ────────────────────────────────────────────────────────────

async function loadGallery(reset=false) {
  if (loading) { if (reset) galleryReloadPending = true; return; }
  if (reset) { offset = 0; currentItems = []; grid.innerHTML = ''; }
  loading = true;
  const revision = galleryFilterRevision;
  const params = new URLSearchParams({ limit, offset });
  if (galleryFilter.start) params.set('start_date', galleryFilter.start);
  if (galleryFilter.end) params.set('end_date', galleryFilter.end);
  filterSummary.textContent = '正在加载作品…';
  loadMoreBtn.style.display = 'none';

  try {
    const resp = await fetch(`/api/v1/gallery?${params}`);
    if (!resp.ok) throw new Error('加载失败: ' + resp.status);
    const data = await resp.json();
    if (revision !== galleryFilterRevision) return;
    const items = data.items || [];
    const range = galleryFilter.start || galleryFilter.end
      ? `${galleryFilter.start || '不限'} 至 ${galleryFilter.end || '不限'}（含当天，服务器本地时间）`
      : '全部时间';
    filterSummary.textContent = `${range} · 共 ${data.total} 张作品。可点「选择」勾选要删除的作品，未选中的作品会保留。`;
    empty.textContent = galleryFilter.start || galleryFilter.end ? '这个时间范围内没有作品' : '暂无图片，生成一些吧～';

    if (reset && items.length === 0) {
      empty.style.display = 'block';
      loadMoreBtn.style.display = 'none';
      return;
    }
    empty.style.display = 'none';

    if (reset) currentItems = [];
    for (const item of items) {
      currentItems.push(item);
      await renderCard(item);
    }
    offset += items.length;

    loadMoreBtn.style.display = items.length === limit ? 'inline-block' : 'none';
  } catch(err) {
    console.error('加载失败:', err);
    if (revision === galleryFilterRevision) filterSummary.textContent = '加载失败，请重新筛选或刷新页面。';
  } finally {
    loading = false;
    if (galleryReloadPending) { galleryReloadPending = false; void loadGallery(true); }
  }
}

loadMoreBtn.addEventListener('click', () => loadGallery());
loadGallery(true);

const cleanupDialog = document.getElementById('cleanupDialog');
const cleanupPeriod = document.getElementById('cleanupPeriod');
const cleanupDate = document.getElementById('cleanupDate');
const cleanupPreview = document.getElementById('cleanupPreview');
const cleanupDelete = document.getElementById('cleanupDelete');
const cleanupView = document.getElementById('cleanupView');
const cleanupStatus = document.getElementById('cleanupStatus');
let cleanupSnapshot = null;
let cleanupBusy = false;
function resetCleanup() {
  cleanupSnapshot = null;
  cleanupDelete.disabled = true;
  cleanupView.disabled = true;
  cleanupDelete.textContent = '确认删除';
  cleanupStatus.textContent = '先预览待删除数量，再确认删除。';
  document.getElementById('cleanupDateField').hidden = cleanupPeriod.value !== 'custom';
}
function setCleanupBusy(busy) {
  cleanupBusy = busy;
  cleanupPeriod.disabled = cleanupDate.disabled = cleanupPreview.disabled = busy;
  cleanupDelete.disabled = busy || !cleanupSnapshot || !cleanupSnapshot.count;
  cleanupView.disabled = busy || !cleanupSnapshot || !cleanupSnapshot.count;
}
async function cleanupRequest(path, body) {
  const response = await fetch('/api/v1/gallery/cleanup' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await response.json();
  if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : '请求失败，请检查日期后重试');
  return data;
}
document.getElementById('cleanupOpen').addEventListener('click', () => cleanupDialog.showModal());
document.getElementById('cleanupClose').addEventListener('click', () => cleanupDialog.close());
cleanupPeriod.addEventListener('change', resetCleanup);
cleanupDate.addEventListener('input', resetCleanup);
cleanupPreview.addEventListener('click', async () => {
  resetCleanup();
  if (cleanupPeriod.value === 'custom' && !cleanupDate.value) { cleanupStatus.textContent = '请选择截止日期。'; return; }
  setCleanupBusy(true);
  cleanupStatus.textContent = '正在统计整个图库…';
  try {
    cleanupSnapshot = await cleanupRequest('/preview', cleanupPeriod.value === 'custom' ? { before: cleanupDate.value } : { months: Number(cleanupPeriod.value) });
    cleanupStatus.textContent = `${cleanupSnapshot.before} 00:00 之前（服务器本地时间）共有 ${cleanupSnapshot.count} 张作品。截止日期当天及之后的作品会保留。`;
    cleanupDelete.textContent = `确认删除 ${cleanupSnapshot.count} 张作品`;
  } catch (error) { cleanupStatus.textContent = error.message; }
  finally { setCleanupBusy(false); }
});
cleanupView.addEventListener('click', () => {
  if (cleanupBusy || !cleanupSnapshot) return;
  const end = new Date(cleanupSnapshot.before + 'T00:00:00Z');
  end.setUTCDate(end.getUTCDate() - 1);
  applyGalleryFilter('', end.toISOString().slice(0, 10));
  cleanupDialog.close();
  // Reviewing does not confirm deletion; require a fresh preview when returning.
  resetCleanup();
});
cleanupDelete.addEventListener('click', async () => {
  if (cleanupBusy || !cleanupSnapshot || !cleanupSnapshot.count) return;
  const confirmed = cleanupSnapshot;
  setCleanupBusy(true);
  cleanupStatus.textContent = '正在删除已确认的作品，请稍候…';
  try {
    const result = await cleanupRequest('', { before: confirmed.before, fingerprint: confirmed.fingerprint });
    exitSelectMode();
    modal.classList.remove('show');
    void loadGallery(true);
    resetCleanup();
    if (result.failed_files.length) {
      cleanupStatus.textContent = `已删除 ${result.deleted} 张作品的图库记录，但有 ${result.failed_files.length} 个文件未能清理。请检查磁盘权限。`;
    } else {
      cleanupDialog.close();
      showToast(`已删除 ${result.deleted} 张旧作品`);
    }
  } catch (error) { resetCleanup(); cleanupStatus.textContent = error.message; }
  finally { setCleanupBusy(false); }
});
</script>

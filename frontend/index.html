<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>AI 图片生成器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
background: #0a0a0f;
color: #e5e5e5;
min-height: 100vh;
}

.container { max-width: 680px; margin: 0 auto; padding: 40px 20px; }

header { text-align: center; margin-bottom: 32px; }

h1 {
font-size: 2rem;
font-weight: 700;
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
margin-bottom: 6px;
}

.subtitle { color: #666; font-size: 0.875rem; }

/* 中文优化 */
label { text-transform: none; }

.card {
background: #141419;
border: 1px solid #2a2a35;
border-radius: 16px;
padding: 28px;
}

.field { margin-bottom: 20px; }

label {
display: block;
font-size: 0.8rem;
font-weight: 500;
color: #888;
margin-bottom: 8px;
text-transform: uppercase;
letter-spacing: 0.05em;
}

select, textarea, input[type="text"] {
width: 100%;
padding: 11px 14px;
background: #1a1a22;
border: 1px solid #2a2a35;
border-radius: 8px;
color: #e5e5e5;
font-size: 0.95rem;
transition: border-color 0.2s;
}

select:focus, textarea:focus, input[type="text"]:focus {
outline: none;
border-color: #667eea;
}

textarea { min-height: 100px; resize: vertical; }

.optimize-btn {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 10px;
  background: transparent;
  border: 1px solid #667eea;
  border-radius: 12px;
  color: #667eea;
  font-size: 0.7rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  vertical-align: middle;
}
.optimize-btn:hover { background: rgba(102,126,234,0.15); color: #8b9cf7; }
.optimize-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.optimize-btn.loading { animation: pulse 1.2s ease-in-out infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: end; }

.upload-area {
border: 2px dashed #2a2a35;
border-radius: 10px;
padding: 24px;
text-align: center;
cursor: pointer;
transition: all 0.2s;
position: relative;
}

.upload-area:hover, .upload-area.dragover {
border-color: #667eea;
background: rgba(102, 126, 234, 0.05);
}

.upload-area input {
position: absolute; inset: 0; opacity: 0; cursor: pointer;
}

.upload-icon { font-size: 1.6rem; margin-bottom: 6px; }
.upload-hint { color: #555; font-size: 0.8rem; }

#imagePreview {
display: none;
margin-top: 12px;
gap: 10px;
flex-wrap: wrap;
}

#imagePreview .preview-item {
position: relative;
display: inline-block;
}

#imagePreview .preview-item img {
max-width: 100px;
max-height: 100px;
border-radius: 6px;
border: 1px solid #2a2a35;
object-fit: cover;
}

#imagePreview .main-badge {
position: absolute;
top: -6px; left: -6px;
background: linear-gradient(135deg, #667eea, #764ba2);
border: none;
border-radius: 10px;
color: white;
cursor: default;
font-size: 9px;
padding: 2px 8px;
font-weight: 600;
letter-spacing: 0.05em;
}

#imagePreview .main-hint {
position: absolute;
bottom: 4px; left: 4px; right: 4px;
background: rgba(0,0,0,0.7);
border-radius: 4px;
color: #aaa;
font-size: 9px;
text-align: center;
padding: 1px 4px;
pointer-events: none;
}

#imagePreview .remove-btn {
position: absolute;
top: -6px; right: -6px;
width: 20px; height: 20px;
background: #ff4757;
border: none;
border-radius: 50%;
color: white;
cursor: pointer;
font-size: 12px;
line-height: 20px;
}

/* orientation toggle */
.orient-toggle {
  display: inline-flex;
  background: #1a1a22;
  border: 1px solid #2a2a35;
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 8px;
}
.orient-toggle button {
  padding: 5px 14px;
  background: transparent;
  border: none;
  color: #666;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
}
.orient-toggle button.active {
  background: #667eea;
  color: #fff;
}

/* conditional quality field — always in layout, disabled when N/A */

.btn {
width: 100%;
padding: 14px;
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
border: none;
border-radius: 8px;
color: white;
font-size: 0.95rem;
font-weight: 600;
cursor: pointer;
transition: opacity 0.2s, transform 0.1s;
}

.btn:hover:not(:disabled) { opacity: 0.88; }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.loader {
display: none;
text-align: center;
padding: 32px;
}

.loader.show { display: block; }

.spinner {
width: 36px; height: 36px;
border: 3px solid #2a2a35;
border-top-color: #667eea;
border-radius: 50%;
animation: spin 1s linear infinite;
margin: 0 auto 12px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.images-grid {
display: none;
gap: 12px;
margin-top: 20px;
}

.images-grid.show { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

.img-card {
background: #1a1a22;
border-radius: 10px;
overflow: hidden;
border: 1px solid #2a2a35;
}

.img-card img {
width: 100%;
aspect-ratio: 1;
object-fit: cover;
display: block;
}

.img-card .actions { padding: 10px; display: flex; gap: 6px; }

.img-card button {
flex: 1;
padding: 7px;
background: #2a2a35;
border: none;
border-radius: 5px;
color: #ccc;
font-size: 0.8rem;
cursor: pointer;
transition: background 0.2s;
}

.img-card button:hover { background: #3a3a45; }

.err-msg {
display: none;
background: rgba(255, 71, 87, 0.1);
border: 1px solid #ff4757;
border-radius: 8px;
padding: 14px;
margin-top: 16px;
color: #ff6b7a;
font-size: 0.9rem;
}

.err-msg.show { display: block; }

.model-hint {
font-size: 0.75rem;
color: #555;
margin-top: 6px;
}

/* Fullscreen image modal */
.img-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 200;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.img-modal.show { display: flex; }
.img-modal img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
}
.img-modal-close {
  position: absolute;
  top: 20px;
  right: 24px;
  background: rgba(30,30,35,0.9);
  border: 1px solid #3a3a45;
  color: #ccc;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.2rem;
  line-height: 40px;
  text-align: center;
}
.img-modal-close:hover { background: #3a3a45; }
</style>
</head>
<body>
<div class="container">
<header>
<h1>AI Image Generator</h1>
<p class="subtitle">OpenAI / PackyAPI / Gemini / MiniMax 图片生成服务</p>
<a href="/gallery" style="position:absolute;top:20px;right:20px;font-size:0.8rem;color:#667eea;text-decoration:none;">🖼️ 图库</a>
<a href="/logs" style="position:absolute;top:20px;right:80px;font-size:0.8rem;color:#667eea;text-decoration:none;">📋 日志</a>
<a id="promptLink" style="position:absolute;top:20px;right:140px;font-size:0.8rem;color:#667eea;text-decoration:none;">💡 Prompt</a>
</header>

<div class="card">
<form id="form">

<div class="field">
<label>Provider</label>
<select id="provider">
<option value="openai" selected>OpenAI-HK</option>
<option value="packy">PackyAPI</option>
<option value="gemini">Gemini</option>
<option value="minimax">MiniMax</option>
</select>
</div>

<div class="field">
<label>模型</label>
<select id="subModel">
<!-- options injected by JS based on provider -->
</select>
<p class="model-hint" id="modelHint"></p>
</div>

<div class="field">
<label>提示词 <button type="button" class="optimize-btn" id="optimizeBtn" title="AI 优化提示词">✨ 优化</button></label>
<textarea id="prompt" placeholder="描述你想要生成的图片，越详细越好..." required></textarea>
</div>

<div class="field">
<label>参考图（可选）</label>
<div class="upload-area" id="uploadArea">
<input type="file" id="imageInput" accept="image/*" multiple>
<div class="upload-icon">&#128247;</div>
<div class="upload-hint">点击或拖拽上传图片</div>
</div>
<div id="imagePreview">
</div>
</div>

<div class="row">
<div class="field">
<label id="sizeLabel">尺寸</label>
<div id="orientToggleWrap" class="orient-toggle" style="display:none;">
  <button type="button" data-orient="landscape" class="active">横幅</button>
  <button type="button" data-orient="portrait">竖幅</button>
</div>
<div id="sizeSelectWrap">
<select id="size">
<option value="1024x1024">1024 x 1024</option>
</select>
</div>
<input type="text" id="sizeCustom" placeholder="例如 1920*1080" style="display:none;">
</div>
<div class="field" id="qualityField">
<label>质量</label>
<select id="quality">
<option value="low">低</option>
<option value="medium" selected>中（默认）</option>
<option value="high">高</option>
</select>
</div>
</div>

<button type="submit" class="btn" id="generateBtn">生成图片</button>
</form>

<div class="loader" id="loader">
<div class="spinner"></div>
<p style="color:#666;font-size:0.9rem" id="loaderText">已提交，等待任务启动...</p>
<p style="color:#444;font-size:0.7rem;margin-top:4px;">任务ID: <code id="loaderTaskId" style="color:#667eea;user-select:all;">-</code></p>
<div class="progress-bar-wrap" id="progressWrap" style="display:none;margin-top:12px;">
  <div class="progress-bar" id="progressBar" style="height:6px;background:#2a2a35;border-radius:3px;overflow:hidden;">
    <div id="progressFill" style="height:100%;background:linear-gradient(90deg,#667eea,#764ba2);width:0%;transition:width 0.4s ease;"></div>
  </div>
  <p style="color:#555;font-size:0.8rem;margin-top:6px;text-align:center;" id="progressText">0%</p>
</div>
</div>

<div class="err-msg" id="errMsg"></div>

<div class="images-grid" id="imagesGrid"></div>
</div>

<!-- 任务查询 -->
<div class="card" style="margin-top:20px;">
<div class="field">
<label>查询任务结果</label>
<div style="display:flex;gap:8px;">
  <input type="text" id="lookupTaskId" placeholder="输入 task_id 找回丢失的生成结果" style="flex:1;">
  <button type="button" id="lookupBtn" class="optimize-btn" style="margin:0;padding:6px 16px;white-space:nowrap;">查询</button>
</div>
<p style="color:#555;font-size:0.7rem;margin-top:6px;">如果前端断连但生成已完成，可凭任务ID找回图片</p>
</div>
<div class="err-msg" id="lookupErr"></div>
<div class="images-grid" id="lookupImagesGrid"></div>
</div>
</div>

<!-- Fullscreen image modal -->
<div class="img-modal" id="imgModal">
  <button class="img-modal-close" id="imgModalClose">×</button>
  <img id="imgModalSrc" src="" alt="">
</div>

<script>
// Prompt 链接：使用服务端注入的 PROMPT_PORTAL_URL 配置
// 将 localhost/127.0.0.1 替换为当前访问的 hostname，使其他电脑也能访问
(function() {
    var url = window.__PROMPT_PORTAL_URL__ ||
        (window.location.protocol + '//' + window.location.hostname + ':8769');
    try {
        var u = new URL(url);
        if (u.hostname === 'localhost' || u.hostname === '127.0.0.1' || u.hostname === '0.0.0.0') {
            u.hostname = window.location.hostname;
        }
        document.getElementById('promptLink').href = u.toString();
    } catch (_) {
        document.getElementById('promptLink').href = url;
    }
})();

const MODELS = {
openai: [
{ value: 'gpt-image-2', label: 'GPT Image 2' },
{ value: 'gpt-image-2-vip', label: 'GPT Image 2 VIP (高清)' },
],
packy: [
{ value: 'gpt-image-2', label: 'GPT Image 2' },
],
gemini: [
{ value: 'gemini-3.1-flash-image-preview', label: 'Gemini 闪存图 (1K)' },
{ value: 'gemini-3.1-flash-image-preview-2k', label: 'Gemini 闪存图 (2K)' },
{ value: 'gemini-3.1-flash-image-preview-4k', label: 'Gemini 闪存图 (4K)' },
],
minimax: [
{ value: 'image-01', label: 'MiniMax 图像-01' },
]
};

const HINTS = {
'gpt-image-2': '1K 及以下尺寸，价格较低',
'gpt-image-2-vip': '2K/4K 高清尺寸，价格为标准版两倍',
'gemini-3.1-flash-image-preview': '标准分辨率，最快速度',
'gemini-3.1-flash-image-preview-2k': '2K 高清分辨率',
'gemini-3.1-flash-image-preview-4k': '4K 超高清分辨率',
'image-01': 'MiniMax 图像模型',
};

// Provider-specific hint overrides
const PROVIDER_HINTS = {
'packy|gpt-image-2': 'PackyAPI 提供商，价格较高，仅作备选',
};

function getModelHint(prov, model) {
  return PROVIDER_HINTS[prov + '|' + model] || HINTS[model] || '';
}

const SIZE_OVERRIDES = {
// Gemini 1K/2K/4K: all support ratio-based sizes (API interprets ratio per tier)
'gemini-3.1-flash-image-preview': { values: ['1:1','4:3','3:4','16:9','9:16','2:3','3:2'], labels: ['1:1','4:3','3:4','16:9','9:16','2:3','3:2'] },
'gemini-3.1-flash-image-preview-2k': { values: ['1:1','4:3','3:4','16:9','9:16','2:3','3:2'], labels: ['1:1','4:3','3:4','16:9','9:16','2:3','3:2'] },
'gemini-3.1-flash-image-preview-4k': { values: ['1:1','4:3','3:4','16:9','9:16','2:3','3:2'], labels: ['1:1','4:3','3:4','16:9','9:16','2:3','3:2'] },
// MiniMax: aspect ratios
'image-01': { values: ['1:1','16:9','9:16','4:3','3:2','2:3','3:4'], labels: ['1:1','16:9','9:16','4:3','3:2','2:3','3:4'] },
};

const QUALITY_MODELS = ['gpt-image-2', 'gpt-image-2-vip'];

// gpt-image-2 分组尺寸定义
const VIP_PIXEL_THRESHOLD = 1659 * 948; // 1,572,852
const SIZES = [
  { name: '自动', ratio: null, d: { '1K': null } },
  { name: '16:9',  ratio: [16, 9],  d: { '1K': [1920, 1080],  '2K': [2560, 1440], '4K': [3840, 2160] } },
  { name: '1:1',   ratio: [1, 1],   d: { '1K': [1024, 1024], '2K': [2048, 2048], '4K': [2880, 2880] } },
  { name: '4:3',   ratio: [4, 3],   d: { '1K': [1024, 768],  '2K': [2048, 1536], '4K': [3072, 2304] } },
  { name: '3:2',   ratio: [3, 2],   d: { '1K': [1008, 672],  '2K': [2064, 1376], '4K': [3504, 2336] } },
  { name: '5:4',   ratio: [5, 4],   d: { '1K': [1040, 832],  '2K': [2080, 1664], '4K': [3200, 2560] } },
  { name: 'A4',    ratio: [297, 210], d: { '1K': [1488, 1056], '2K': [2064, 1456], '4K': [3408, 2416] } },
  { name: '21:9',  ratio: [21, 9],  d: { '1K': [1344, 576],  '2K': [2016, 864],  '4K': [3808, 1632] } },
];
let currentOrient = 'landscape'; // landscape | portrait

const providerSel = document.getElementById('provider');
const subModelSel = document.getElementById('subModel');
const modelHint = document.getElementById('modelHint');
const qualityField = document.getElementById('qualityField');
const sizeSel = document.getElementById('size');

// 从 URL 参数读取 prompt 并填入（支持 prompt-portal 跳转）
const urlParams = new URLSearchParams(window.location.search);
const promptFromUrl = urlParams.get('prompt');
if (promptFromUrl) {
    document.getElementById('prompt').value = promptFromUrl;
}

function rebuildModels() {
const prov = providerSel.value;
const models = MODELS[prov] || [];
const current = subModelSel.value;

subModelSel.innerHTML = '';
models.forEach(m => {
const opt = document.createElement('option');
opt.value = m.value;
opt.textContent = m.label;
subModelSel.appendChild(opt);
});

// restore if still valid
if (models.find(m => m.value === current)) {
subModelSel.value = current;
}

applyModelConstraints();
}

function applyModelConstraints() {
const model = subModelSel.value;
const prov = providerSel.value;

// hint
modelHint.textContent = getModelHint(prov, model);

// quality field: show for gpt-image-2, disable for others
const qualitySel = document.getElementById('quality');
if (QUALITY_MODELS.includes(model)) {
  qualitySel.disabled = false;
  qualitySel.style.opacity = '';
  qualityField.querySelector('label').style.color = '';
} else {
  qualitySel.disabled = true;
  qualitySel.style.opacity = '0.4';
  qualityField.querySelector('label').style.color = '#444';
}

// size label: "Aspect Ratio" for MiniMax, "Size" for others
const sizeLabel = document.getElementById('sizeLabel');
sizeLabel.textContent = (prov === 'minimax') ? 'Aspect Ratio' : 'Size';

// size options
if (SIZE_OVERRIDES[model]) {
document.getElementById('orientToggleWrap').style.display = 'none';
const opts = SIZE_OVERRIDES[model];
sizeSel.innerHTML = '';
opts.values.forEach((v, i) => {
const opt = document.createElement('option');
opt.value = v;
opt.textContent = opts.labels[i];
sizeSel.appendChild(opt);
});
} else if (prov === 'minimax') {
// MiniMax defaults to 1:1
document.getElementById('orientToggleWrap').style.display = 'none';
sizeSel.innerHTML = '';
const opts = { values: ['1:1','16:9','9:16','4:3','3:2','2:3','3:4'], labels: ['1:1','16:9','9:16','4:3','3:2','2:3','3:4'] };
opts.values.forEach((v, i) => {
const opt = document.createElement('option');
opt.value = v;
opt.textContent = opts.labels[i];
sizeSel.appendChild(opt);
});
} else {
    // gpt-image-2: 分组尺寸 + 方向切换
    document.getElementById('orientToggleWrap').style.display = '';
    rebuildGptSizes();
}
}

// 根据尺寸自动选择模型：≤1659x948 像素用 gpt-image-2，超过用 gpt-image-2-vip
function updateModelForSize() {
  const prov = providerSel.value;
  if (prov !== 'openai') return;

  const val = sizeSel.value;
  if (val === 'auto' || val === '__custom__') {
    subModelSel.value = 'gpt-image-2';
  } else {
    const parts = val.split('x');
    const w = parseInt(parts[0]);
    const h = parseInt(parts[1]);
    if (!isNaN(w) && !isNaN(h) && w * h > VIP_PIXEL_THRESHOLD) {
      subModelSel.value = 'gpt-image-2-vip';
    } else {
      subModelSel.value = 'gpt-image-2';
    }
  }
  modelHint.textContent = getModelHint(prov, subModelSel.value);
}

// 重建 gpt-image-2 分组尺寸下拉框（optgroup by tier）
function rebuildGptSizes() {
  const prev = sizeSel.value;
  sizeSel.innerHTML = '';

  // 自动
  const autoOpt = document.createElement('option');
  autoOpt.value = 'auto';
  autoOpt.textContent = '自动（保持参考图比例）';
  sizeSel.appendChild(autoOpt);

  // 按 tier 分组（packy 不需要 VIP 区分，gpt-image-2 直接支持全部尺寸）
  const prov = providerSel.value;
  const tiers = prov === 'openai'
    ? [
        { key: '1K', label: '1K — 标准' },
        { key: '2K', label: '2K — VIP 高清' },
        { key: '4K', label: '4K — VIP 超高清' },
      ]
    : [
        { key: '1K', label: '1K — 标准' },
        { key: '2K', label: '2K — 贵！慎重！' },
        { key: '4K', label: '4K — 贵！慎重！' },
      ];

  tiers.forEach(tier => {
    const group = document.createElement('optgroup');
    group.label = tier.label;
    SIZES.forEach(s => {
      if (!s.d[tier.key]) return; // skip "自动"
      const px = s.d[tier.key];
      const [lw, lh] = currentOrient === 'portrait' ? [px[1], px[0]] : px;
      const opt = document.createElement('option');
      opt.value = lw + 'x' + lh;
      opt.textContent = s.name + '  ·  ' + lw + '×' + lh;
      group.appendChild(opt);
    });
    if (group.children.length > 0) sizeSel.appendChild(group);
  });

  // 自定义
  const custom = document.createElement('option');
  custom.value = '__custom__';
  custom.textContent = '自定义...';
  sizeSel.appendChild(custom);

  // 恢复选中项
  if ([...sizeSel.options].some(o => o.value === prev)) {
    sizeSel.value = prev;
  } else {
    sizeSel.selectedIndex = 0;
  }

  document.getElementById('sizeCustom').style.display = 'none';
  document.getElementById('sizeSelectWrap').style.display = '';
  updateModelForSize();
}

// 方向切换
document.getElementById('orientToggleWrap').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const orient = btn.dataset.orient;
  if (orient === currentOrient) return;
  currentOrient = orient;
  document.querySelectorAll('#orientToggleWrap button').forEach(b => {
    b.classList.toggle('active', b.dataset.orient === orient);
  });
  rebuildGptSizes();
});

providerSel.addEventListener('change', rebuildModels);
subModelSel.addEventListener('change', applyModelConstraints);
sizeSel.addEventListener('change', () => {
  const isCustom = sizeSel.value === '__custom__';
  document.getElementById('sizeSelectWrap').style.display = isCustom ? 'none' : '';
  document.getElementById('sizeCustom').style.display = isCustom ? '' : 'none';
  if (isCustom) document.getElementById('sizeCustom').focus();
  if (!isCustom && sizeSel.value !== 'auto') updateModelForSize();
});

// 自定义尺寸输入时也自动切换模型
document.getElementById('sizeCustom').addEventListener('blur', () => {
  if (providerSel.value !== 'openai') return;
  const raw = document.getElementById('sizeCustom').value.trim().replace(/\*/g, 'x');
  const parts = raw.split('x');
  if (parts.length === 2) {
    const pw = parseInt(parts[0]), ph = parseInt(parts[1]);
    if (!isNaN(pw) && !isNaN(ph)) {
      if (pw * ph > VIP_PIXEL_THRESHOLD) {
        subModelSel.value = 'gpt-image-2-vip';
      } else {
        subModelSel.value = 'gpt-image-2';
      }
      modelHint.textContent = getModelHint(providerSel.value, subModelSel.value);
    }
  }
});

// upload handling
const uploadArea = document.getElementById('uploadArea');
const imageInput = document.getElementById('imageInput');
const imagePreview = document.getElementById('imagePreview');
let selectedFiles = [];

uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => {
e.preventDefault();
uploadArea.classList.remove('dragover');
const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
if (files.length) handleFiles(files);
});
imageInput.addEventListener('change', e => {
const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
if (files.length) handleFiles(files);
});

function handleFiles(files) {
selectedFiles = selectedFiles.concat(files);
renderPreviews();
// 有参考图时默认自动（保持原图比例）
if (selectedFiles.length > 0 && subModelSel.value.startsWith('gpt-image-2')) {
  sizeSel.value = 'auto';
  updateModelForSize();
}
}

function promoteToMain(idx) {
  if (idx === 0) return;
  const [file] = selectedFiles.splice(idx, 1);
  selectedFiles.unshift(file);
  renderPreviews();
}

function renderPreviews() {
imagePreview.innerHTML = '';
imagePreview.style.display = selectedFiles.length ? 'flex' : 'none';

selectedFiles.forEach((file, idx) => {
  const isMain = idx === 0;
  const reader = new FileReader();
  reader.onload = e => {
    const item = document.createElement('div');
    item.className = 'preview-item';
    if (!isMain) {
      item.style.cursor = 'pointer';
      item.title = '点击设为主图';
    }

    const img = document.createElement('img');
    img.src = e.target.result;
    if (isMain) {
      img.style.border = '2px solid #667eea';
    }
    item.appendChild(img);

    if (isMain) {
      const badge = document.createElement('span');
      badge.className = 'main-badge';
      badge.textContent = '主图';
      item.appendChild(badge);
    } else {
      const hint = document.createElement('div');
      hint.className = 'main-hint';
      hint.textContent = '点击设为主图';
      item.appendChild(hint);
      item.addEventListener('click', () => promoteToMain(idx));
    }

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'remove-btn';
    btn.textContent = '✕';
    btn.addEventListener('click', (ev) => { ev.stopPropagation(); removeFile(idx); });
    item.appendChild(btn);
    imagePreview.appendChild(item);
  };
  reader.readAsDataURL(file);
});
}

function removeFile(idx) {
selectedFiles.splice(idx, 1);
imageInput.value = '';
if (selectedFiles.length === 0) {
  imagePreview.style.display = 'none';
}
renderPreviews();
}

function fileToBase64(file) {
return new Promise((resolve, reject) => {
const reader = new FileReader();
reader.onload = () => resolve(reader.result.split(',')[1]);
reader.onerror = reject;
reader.readAsDataURL(file);
});
}

async function filesToBase64List(files) {
const list = [];
for (const f of files) {
  list.push(await fileToBase64(f));
}
return list;
}

function downloadImage(dataUrl, filename) {
const a = document.createElement('a');
a.href = dataUrl;
a.download = filename;
a.click();
}

function openImageModal(dataUrl) {
    const modal = document.getElementById('imgModal');
    const modalImg = document.getElementById('imgModalSrc');
    modalImg.src = dataUrl;
    modal.classList.add('show');
}

document.getElementById('imgModalClose').addEventListener('click', () => {
    document.getElementById('imgModal').classList.remove('show');
});
document.getElementById('imgModal').addEventListener('click', e => {
    if (e.target === document.getElementById('imgModal')) {
        document.getElementById('imgModal').classList.remove('show');
    }
});

const form = document.getElementById('form');
const loader = document.getElementById('loader');
const loaderText = document.getElementById('loaderText');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressTextEl = document.getElementById('progressText');
const imagesGrid = document.getElementById('imagesGrid');
const errMsg = document.getElementById('errMsg');
const generateBtn = document.getElementById('generateBtn');

let pollInterval = null;

function setProgress(pct, label) {
  progressFill.style.width = pct + '%';
  progressTextEl.textContent = label || (pct + '%');
}

function showLoader(msg) {
  loader.classList.add('show');
  loaderText.textContent = msg || '生成中...';
  progressWrap.style.display = 'none';
}

function showGenerating(taskId) {
  loader.classList.add('show');
  progressWrap.style.display = 'block';
  setProgress(10, '请求已发送...');

  const startTime = Date.now();
  const ESTIMATED_MS = 180000; // 3 min

  // Time-based progress while waiting for response
  const progressTimer = setInterval(() => {
    if (!pollInterval) return; // already cleared
    const elapsed = Date.now() - startTime;
    const pct = Math.min(90, Math.floor(10 + (elapsed / ESTIMATED_MS) * 80));
    setProgress(pct, 'AI 正在生成...');
  }, 5000);

  return new Promise((resolve, reject) => {
    pollInterval = setInterval(async () => {
      try {
        const resp = await fetch(`/api/v1/tasks/${taskId}`);
        if (!resp.ok) {
          clearInterval(progressTimer);
          reject(new Error(`查询任务失败 (${resp.status})`));
          return;
        }
        const data = await resp.json();

        if (data.status === 'completed') {
          clearInterval(pollInterval);
          clearInterval(progressTimer);
          pollInterval = null;
          setProgress(95, '收到返回，解析中...');
          loader.classList.remove('show');
          resolve(data.images || []);
        } else if (data.status === 'failed') {
          clearInterval(pollInterval);
          clearInterval(progressTimer);
          pollInterval = null;
          loader.classList.remove('show');
          reject(new Error(data.error || '生成失败，可尝试降低分辨率'));
        }
        // else running: keep using time-based progress, don't override
      } catch (err) {
        // Network error during poll — keep waiting, don't fail immediately
      }
    }, 3000);
  });
}

function renderImagesTo(images, gridEl) {
  if (!images.length) return;
  gridEl.innerHTML = '';
  gridEl.classList.add('show');

  for (let i = 0; i < images.length; i++) {
    const img = images[i];
    const dataUrl = img.base64
      ? `data:image/png;base64,${img.base64}`
      : img.url;

    const card = document.createElement('div');
    card.className = 'img-card';

    const imgEl = document.createElement('img');
    imgEl.src = dataUrl;
    imgEl.alt = `图片 ${i + 1}`;
    imgEl.style.cursor = 'zoom-in';
    imgEl.addEventListener('click', () => openImageModal(dataUrl));
    card.appendChild(imgEl);

    const actions = document.createElement('div');
    actions.className = 'actions';

    const dlBtn = document.createElement('button');
    dlBtn.textContent = '下载';
    dlBtn.addEventListener('click', () => downloadImage(dataUrl, `img-${Date.now()}-${i+1}.png`));
    actions.appendChild(dlBtn);

    const openBtn = document.createElement('button');
    openBtn.textContent = '放大';
    openBtn.addEventListener('click', () => openImageModal(dataUrl));
    actions.appendChild(openBtn);

    if (img.adjusted_size) {
      const sizeTag = document.createElement('span');
      sizeTag.style.cssText = 'font-size:0.7rem;color:#555;padding:7px 4px;';
      sizeTag.textContent = img.adjusted_size;
      actions.appendChild(sizeTag);
    }

    card.appendChild(actions);
    gridEl.appendChild(card);
  }
}

function renderImages(images) {
  renderImagesTo(images, document.getElementById('imagesGrid'));
}

form.addEventListener('submit', async e => {
  e.preventDefault();

  // Guard: prevent re-submission while a task is running
  if (generateBtn.disabled) return;

  errMsg.classList.remove('show');
  imagesGrid.classList.remove('show');
  imagesGrid.innerHTML = '';
  generateBtn.disabled = true;

  try {
    let sizeVal = sizeSel.value === '__custom__' ? document.getElementById('sizeCustom').value.trim() : sizeSel.value;
    // 支持 1920*1080 格式（* 号）
    sizeVal = sizeVal.replace(/\*/g, 'x');

    // 根据实际尺寸自动选择模型
    let finalModel = subModelSel.value;
    if (providerSel.value === 'openai' && sizeVal && sizeVal !== 'auto') {
      const parts = sizeVal.split('x');
      if (parts.length === 2) {
        const pw = parseInt(parts[0]), ph = parseInt(parts[1]);
        if (!isNaN(pw) && !isNaN(ph) && pw * ph > VIP_PIXEL_THRESHOLD) {
          finalModel = 'gpt-image-2-vip';
        } else {
          finalModel = 'gpt-image-2';
        }
      }
    }

    const body = {
      model: providerSel.value,
      sub_model: finalModel,
      prompt: document.getElementById('prompt').value,
      size: sizeVal,
      n: 1,
    };

    const qualitySel = document.getElementById('quality');
    if (!qualitySel.disabled && qualitySel.value) {
      body.quality = qualitySel.value;
    }

    if (selectedFiles.length > 0) {
      const b64List = await filesToBase64List(selectedFiles);
      body.image_base64 = b64List[0];         // backward compat: first image as single string
      body.image_base64s = b64List;           // all images as array
    }

    const resp = await fetch('/api/v1/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.detail || '生成失败，可尝试降低分辨率');
    }

    const data = await resp.json();
    const taskId = data.task_id;
    document.getElementById('loaderTaskId').textContent = taskId;

    // Wait for generation to finish — this Promise resolves on completed, rejects on failed
    const images = await showGenerating(taskId);

    if (images && images.length > 0) {
      renderImages(images);
    } else {
      throw new Error('未返回任何图片');
    }

  } catch (err) {
    errMsg.textContent = err.message;
    errMsg.classList.add('show');
  } finally {
    generateBtn.disabled = false;
  }
});

// ── AI prompt optimization ────────────────────────────────────────────
const optimizeBtn = document.getElementById('optimizeBtn');

optimizeBtn.addEventListener('click', async () => {
  const raw = document.getElementById('prompt').value.trim();
  if (!raw) {
    document.getElementById('prompt').focus();
    return;
  }
  optimizeBtn.disabled = true;
  optimizeBtn.classList.add('loading');
  optimizeBtn.textContent = '⏳ 优化中...';
  try {
    const resp = await fetch('/api/v1/optimize-prompt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: raw }),
    });
    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.detail || 'API ' + resp.status);
    }
    const data = await resp.json();
    if (data.optimized_prompt) {
      document.getElementById('prompt').value = data.optimized_prompt;
    }
  } catch (err) {
    alert('优化失败: ' + err.message);
  } finally {
    optimizeBtn.disabled = false;
    optimizeBtn.classList.remove('loading');
    optimizeBtn.textContent = '✨ 优化';
  }
});

// -- Task lookup (for recovering lost results) --
document.getElementById('lookupBtn').addEventListener('click', async () => {
  const taskId = document.getElementById('lookupTaskId').value.trim();
  const errEl = document.getElementById('lookupErr');
  const gridEl = document.getElementById('lookupImagesGrid');
  errEl.classList.remove('show');
  gridEl.classList.remove('show');
  gridEl.innerHTML = '';

  if (!taskId) return;

  const lookupBtn = document.getElementById('lookupBtn');
  lookupBtn.disabled = true;
  lookupBtn.textContent = '查询中...';

  try {
    const resp = await fetch(`/api/v1/tasks/${taskId}`);
    if (!resp.ok) throw new Error(`任务不存在 (${resp.status})`);
    const data = await resp.json();

    if (data.status === 'completed' && data.images && data.images.length > 0) {
      renderImagesTo(data.images, gridEl);
      gridEl.classList.add('show');
    } else if (data.status === 'failed') {
      errEl.textContent = '任务失败: ' + (data.error || '未知错误');
      errEl.classList.add('show');
    } else if (data.status === 'running' || data.status === 'pending') {
      errEl.textContent = '任务仍在生成中，请稍后再查询';
      errEl.classList.add('show');
      errEl.style.borderColor = '#667eea';
      errEl.style.color = '#667eea';
      errEl.style.background = 'rgba(102,126,234,0.1)';
    }
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.add('show');
  } finally {
    lookupBtn.disabled = false;
    lookupBtn.textContent = '查询';
  }
});

// init
rebuildModels();
</script>
</body>
</html>
